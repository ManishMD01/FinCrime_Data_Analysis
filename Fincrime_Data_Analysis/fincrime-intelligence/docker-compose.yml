version: "3.8"

services:
  frontend-php:
    build:
      context: ./frontend-php
      dockerfile: infra/docker/Dockerfile.php
    ports:
      - "8080:80"
    volumes:
      - ./frontend-php:/var/www/html
    depends_on:
      - backend-python

  backend-python:
    build:
      context: ./backend-python
      dockerfile: infra/docker/Dockerfile.python
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend-python:/app
